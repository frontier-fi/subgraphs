        - Factory
        - Pool
      abis:
        - name: Gyro2CLPPool
          file: ./abis/Gyro2CLPPool.json
        - name: BasePoolFactory
          file: ./abis/BasePoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed address)
          handler: handleGyro2PoolCreated
      file: ./src/mappings/gyro2.ts
  {{/if}}
  {{#if GyroECLPPoolV2Factory}}

specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  {{#if WeightedPoolV2Factory}}
  - kind: ethereum
    name: WeightedPoolV2Factory
    network: {{ network }}
    source:
      abi: BasePoolFactory
      address: "{{ WeightedPoolV2Factory.address }}"
      startBlock: {{ WeightedPoolV2Factory.startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Factory
        - Pool
      abis:
        - name: WeightedPool
          file: ./abis/WeightedPool.json
        - name: BasePoolFactory
          file: ./abis/BasePoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed address)
          handler: handleWeightedPoolV2Created
      file: ./src/mappings/weighted.ts
  {{/if}}
  {{#if StablePoolV2Factory}}
  - kind: ethereum
    name: StablePoolV2Factory
    network: {{ network }}
    source:

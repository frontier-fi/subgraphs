specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  {{#if WeightedPoolFactory}}
  - kind: ethereum
    name: WeightedPoolFactory
    network: {{ network }}
    source:
      abi: BasePoolFactory
      address: "{{ WeightedPoolFactory.address }}"
      startBlock: {{ WeightedPoolFactory.startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Factory
        - Pool
      abis:
        - name: WeightedPool
          file: ./abis/WeightedPool.json
        - name: BasePoolFactory
          file: ./abis/BasePoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed address)
          handler: handleWeightedPoolCreated
      file: ./src/mappings/weighted.ts
  {{/if}}
  {{#if StablePoolFactory}}
  - kind: ethereum
    name: StablePoolFactory
    network: {{ network }}
    source:
      abi: BasePoolFactory
      address: "{{ StablePoolFactory.address }}"
      startBlock: {{ StablePoolFactory.startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Factory
        - Pool
      abis:
        - name: StablePool
          file: ./abis/StablePool.json
        - name: BasePoolFactory
          file: ./abis/BasePoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed address)
          handler: handleStablePoolCreated
      file: ./src/mappings/stable.ts
  {{/if}}
  {{#if GyroECLPPoolFactory}}
  - kind: ethereum
    name: GyroECLPPoolFactory
    network: {{ network }}
    source:
      abi: BasePoolFactory
      address: "{{ GyroECLPPoolFactory.address }}"
      startBlock: {{ GyroECLPPoolFactory.startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Factory
        - Pool
      abis:
        - name: GyroECLPPool
          file: ./abis/GyroECLPPool.json
        - name: BasePoolFactory
          file: ./abis/BasePoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed address)
          handler: handleEclpPoolCreated
      file: ./src/mappings/eclp.ts
  {{/if}}
templates:
  {{#if StablePoolFactory}}
  - kind: ethereum/contract
    name: StablePool
    network: {{ network }}
    source:
      abi: StablePool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - StableParams
        - Pool
      abis:
        - name: StablePool
          file: ./abis/StablePool.json
      eventHandlers:
        - event: AmpUpdateStarted(uint256,uint256,uint256,uint256)
          handler: handleAmpUpdateStarted
        - event: AmpUpdateStopped(uint256)
          handler: handleAmpUpdateStopped
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            every: 120
      file: ./src/mappings/amp.ts
  {{/if}}

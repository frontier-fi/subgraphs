enum PoolType {
  Weighted
  Stable
  ECLP
}

type Factory @entity(immutable: false) {
  "Unique identifier for the Factory"
  id: Bytes!
  "Address of the Factory contract"
  address: Bytes!
  "Type of pools this Factory creates"
  type: PoolType!
  "Version number of the Factory"
  version: Int!
  "Pools created by this Factory"
  pools: [Pool!] @derivedFrom(field: "factory")
}

type WeightedParams @entity(immutable: true) {
  "Unique identifier for the WeightedPoolParams"
  id: Bytes!
  "Token weights for Weighted Pools"
  weights: [BigDecimal!]!
}

type StableParams @entity(immutable: false) {
  "Unique identifier for the StablePoolParams"
  id: Bytes!
  "Amplification parameter, integer part (ampRaw / AMP_PRECISION). Set at creation and on amp events, so it lags the chain during a ramp"
  amp: BigInt!
  "Amplification parameter as the pool reports it, scaled by AMP_PRECISION (1000). Same update rule as amp"
  ampRaw: BigInt!
  "Set by AmpUpdateStarted, cleared by AmpUpdateStopped. A ramp that completes naturally emits no event, so compare ampEndTime to the current time"
  ampIsUpdating: Boolean!
  "Ramp start amplification value (divided by AMP_PRECISION, fraction kept)"
  ampStartValue: BigDecimal!
  "Ramp end amplification value (divided by AMP_PRECISION, fraction kept)"
  ampEndValue: BigDecimal!
  "Ramp start timestamp"
  ampStartTime: BigInt!
  "Ramp end timestamp"
  ampEndTime: BigInt!
}

type EclpParams @entity(immutable: true) {
  "Unique identifier for the EclpParams"
  id: Bytes!
  alpha: BigDecimal!
  beta: BigDecimal!
  c: BigDecimal!
  s: BigDecimal!
  lambda: BigDecimal!
  tauAlphaX: BigDecimal!
  tauAlphaY: BigDecimal!
  tauBetaX: BigDecimal!
  tauBetaY: BigDecimal!
  u: BigDecimal!
  v: BigDecimal!
  w: BigDecimal!
  z: BigDecimal!
  dSq: BigDecimal!
}

type Pool @entity(immutable: false) {
  "Unique identifier for the Pool"
  id: Bytes!
  "Address of the Pool contract"
  address: Bytes!
  "Factory that created this Pool"
  factory: Factory!
  "Parameters for Weighted pools (null for other pool types)"
  weightedParams: WeightedParams
  "Parameters for Stable pools (null for other pool types)"
  stableParams: StableParams
  "Parameters for ECLP pools (null for other pool types)"
  eclpParams: EclpParams
}

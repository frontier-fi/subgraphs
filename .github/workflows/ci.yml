name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build all
        run: pnpm build:all

  test:
    # graph-cli only fetches matchstick binaries for Ubuntu 18/20/22.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Generate manifests and constants
        run: pnpm generate-manifests

      - name: Test
        run: pnpm test

      - name: Mapping tests (matchstick)
        run: pnpm test:mappings

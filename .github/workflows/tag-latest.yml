name: Tag latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to point latest at (short git SHA)"
        required: true
        type: string
      subgraph:
        description: "Subgraph (or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - vault
          - pools
      network:
        description: "Network"
        required: true
        default: "sepolia"
        type: choice
        options:
          - sepolia
          - mainnet

jobs:
  tag:
    runs-on: ubuntu-latest
    environment: graph
    env:
      ORMI_DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Probe Ormi tag routes
        run: |
          set -euo pipefail
          for p in \
            /public_api/v1/0xGraph/tags/create-tag \
            /api/public/v1/0xGraph/tags/create-tag \
            /api/private/v1/0xGraph/tags/create-tag
          do
            echo "=== POST $p ==="
            curl -sS -D - -o /tmp/ormi-body.txt -X POST "https://api.subgraph.ormilabs.com${p}" \
              -H "Authorization: Bearer ${ORMI_DEPLOY_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"subgraph_name":"vault-sepolia","version":"b4662a4","tag":"latest"}' \
              | head -20
            echo "body: $(head -c 300 /tmp/ormi-body.txt)"
            echo
          done

      - name: Tag latest
        run: |
          set -euo pipefail
          NETWORK="${{ inputs.network }}"
          VERSION="${{ inputs.version }}"
          if [ "${{ inputs.subgraph }}" = "all" ]; then
            SUBGRAPHS="vault pools"
          else
            SUBGRAPHS="${{ inputs.subgraph }}"
          fi
          for s in $SUBGRAPHS; do
            name="${s}-${NETWORK}"
            echo "Tagging ${name}@${VERSION} as latest"
            node scripts/tag-latest.js "$name" "$VERSION"
          done
